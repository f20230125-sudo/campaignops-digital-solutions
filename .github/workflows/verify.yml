name: Verify CampaignOps
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m pipeline.generate && python -m pipeline.build && python scripts/package-wordpress.py
      - run: npm ci
      - run: npx tsc --noEmit && npm run lint && npm run build:vercel
      - run: python qa/package-native.py && node qa/native.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run start:vercel > /tmp/campaign-server.log 2>&1 &
      - run: node qa/browser.mjs http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaignops-verification
          path: qa-output/
